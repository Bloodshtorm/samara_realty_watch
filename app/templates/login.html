<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Samara Realty Watch</title>
  <style>
    :root { --bg: #eef2f6; --panel: #fff; --text: #19202a; --muted: #657080; --line: #d9dee7; --accent: #0f766e; --danger: #b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(420px, calc(100% - 32px)); margin: 12vh auto 0; }
    form, .panel { display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
    h1 { margin: 0 0 14px; font-size: 26px; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
    input { width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; color: var(--text); }
    button { min-height: 38px; border: 1px solid var(--accent); border-radius: 6px; padding: 7px 14px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .error { color: var(--danger); font-weight: 700; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Samara Realty Watch</h1>
    {% if not has_users %}
      <section class="panel">
        <strong>Администратор не создан</strong>
        <div class="muted">Задайте APP_ADMIN_USERNAME и APP_ADMIN_PASSWORD в окружении web-сервиса и перезапустите приложение.</div>
      </section>
    {% else %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <label>Логин
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>Пароль
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Войти</button>
      </form>
    {% endif %}
  </main>
</body>
</html>
