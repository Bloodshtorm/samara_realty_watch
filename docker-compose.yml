services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realty}
      POSTGRES_USER: ${POSTGRES_USER:-realty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realty} -d ${POSTGRES_DB:-realty}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  collector:
    image: samara_realty_watch-collector:latest
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/browser-profile:/data/browser-profile
      - ./data/debug:/app/data/debug
      - ./data/reports:/app/data/reports
      - ./config:/app/config
    command: ["python", "-m", "app", "collect"]

  scheduler:
    build: .
    env_file:
      - .env
    environment:
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-7200}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/browser-profile:/data/browser-profile
      - ./data/debug:/app/data/debug
      - ./data/reports:/app/data/reports
      - ./config:/app/config
    restart: unless-stopped
    command:
      - bash
      - -lc
      - |
        while true; do
          python -m app collect
          sleep "$${COLLECT_INTERVAL_SECONDS:-7200}"
        done

  browser-auth:
    build:
      context: .
      dockerfile: Dockerfile.novnc
    env_file:
      - .env
    environment:
      NOVNC_PASSWORD: ${NOVNC_PASSWORD:-change_me}
      AUTH_URLS: ${AUTH_URLS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
    volumes:
      - ./data/browser-profile:/data/browser-profile
      - ./data/debug:/app/data/debug
      - ./data/reports:/app/data/reports
      - ./config:/app/config
    profiles: ["auth"]

  web:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.web:app", "--host", "0.0.0.0", "--port", "8000"]

  metabase:
    image: metabase/metabase:latest
    profiles: ["analytics"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

volumes:
  postgres_data:
  metabase_data:
